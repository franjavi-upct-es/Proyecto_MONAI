# LIDC-IDRI config for Phase 5 radiomics/classification.
name: lidc
root: data/raw/LIDC-IDRI

# Phase 5 consumes a nodule-level manifest with columns:
# patient_id,nodule_id,image,mask_gt,malignancy_median
# Rows with median malignancy == 3 are discarded.
manifest: data/processed/lidc/nodule_manifest.csv
pred_masks_dir: data/processed/lidc/pred_masks
n_folds: 5

# Consensus rule for benign/malignant labelling on LIDC nodules:
#   median rater malignancy >= 4  -> malignant
#   median rater malignancy <= 2  -> benign
#   median == 3                   -> discard
malignancy_consensus:
  malignant_min: 4
  benign_max: 2
