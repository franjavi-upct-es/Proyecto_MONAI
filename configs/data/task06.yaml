# Configuración del dataset MSD Task06_Lung.
name: task06
root: data/raw/Task06_Lung
dataset_json: ${data.root}/dataset.json

# GroupKFold a nivel de paciente con estratificación aproximada basada en volumen (B2).
n_folds: 5
splits_dir: data/splits

# Espaciado físico remuestreado (mm). XY isotrópico, Z estable para que el contexto 2.5D
# tenga un significado físico consistente en todos los casos.
target_spacing: [0.79, 0.79, 1.24]

# Ventana de recorte HU para CT de tórax.
# NOTA: a_max se aumentó de 325 a 400 para retener la señal de costillas calcificadas y
# tejido blando denso en el ápice pulmonar. Las reglas de CLAUDE.md permiten esta
# desviación cuando está justificada; revisar si perjudica la segmentación de tumores de tejido blando puro.
hu_clip:
  a_min: -1024
  a_max: 400
  b_min: 0.0
  b_max: 1.0
  clip: true

# Recorte y muestreo (B2 materializará esto en transformaciones de MONAI).
crop_foreground:
  source_key: image
  threshold: 0.1
sampler:
  pos: 2
  neg: 1
  num_samples: 4

# Estrategia de caché. Usando el modo 'disk' como punto medio: evita el error de RAM OOM
# al almacenar las transformaciones procesadas en el SSD/HDD, mientras que sigue siendo
# mucho más rápido que no usar ninguna caché.
cache:
  mode: disk          # disk evita RAM OOM; usa ram solo en máquinas con mucha memoria
  rate: 1.0           # Cachear todos los archivos en disco tras el primer procesamiento
  num_workers: 2      # workers usados para generar la caché
  disk_dir: data/cache/monai
