# DynUNet 3D — optional alternative to SegResNet.
# When deep_supervision=true the network returns shape (B, n_ds, C, ...);
# B3's deep_supervision_loss handles the stacked output and B4's val path
# uses out[:, 0] as the final-resolution prediction.
name: dynunet
spatial_dims: 3
in_channels: 1
out_channels: 2
kernel_size: [[3, 3, 3], [3, 3, 3], [3, 3, 3], [3, 3, 3], [3, 3, 3], [3, 3, 3]]
strides:     [[1, 1, 1], [2, 2, 2], [2, 2, 2], [2, 2, 2], [2, 2, 2], [2, 2, 1]]
upsample_kernel_size: [[2, 2, 2], [2, 2, 2], [2, 2, 2], [2, 2, 2], [2, 2, 1]]
norm_name: instance
deep_supervision: true
deep_supr_num: 3
res_block: true

loss:
  name: dice_ce
  to_onehot_y: true
  softmax: true
  include_background: false
  lambda_dice: 1.0
  lambda_ce: 1.0
