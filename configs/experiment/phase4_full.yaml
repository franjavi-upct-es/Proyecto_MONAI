# Fase 4: entrenamiento completo en el fold 0. Criterio de aceptación: DSC >= 0.45.
name: phase4_full
max_iterations: 500
val_every: 25
patience: 8
grad_accum_steps: 8
log_every: 10
fixed_iterations: false

# Política de checkpointing en disco. Defaults conservadores para discos
# pequeños: solo `best.pt`, sin optimizer/scheduler/scaler. Activa estos
# flags si necesitas reanudar entrenamiento desde el último estado.
save_last_checkpoint: false
save_resume_state: false
