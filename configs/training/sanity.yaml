# Sanity profile: overfit a single batch in a few hundred steps.
# Used by `python -m lungseg.cli train --config-name=sanity`.
name: sanity
patch_size: [96, 96, 96]
batch_size: 2
num_workers: 0
amp: false
pin_memory: false

optimizer:
  name: adamw
  lr: 3.0e-4
  weight_decay: 0.0

scheduler:
  name: poly
  exp: 0.9

augment_regime: none

inference:
  sw_batch_size: 1
  overlap: 0.25
  mode: gaussian
  padding_mode: constant

# Sanity-specific knobs (read by the trainer in B4).
sanity:
  overfit_one_batch: true
  max_iterations: 200
  val_every: 50
