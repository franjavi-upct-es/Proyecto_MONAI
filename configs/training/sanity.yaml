# Sanity profile: overfit a single batch in a few hundred steps.
# Used by `python -m lungseg.cli train --config-name=sanity`.
name: sanity
patch_size: [96, 96, 96]
batch_size: 1
num_workers: 8
amp: true
pin_memory: true
resume_from: null

unfreeze_epoch: -1
unfreeze_lr_factor: 1.0

optimizer:
  name: adamw
  lr: 3.0e-4
  weight_decay: 0.0

scheduler:
  name: cosine_warmup
  warmup_steps: 50

augment_regime: none

inference:
  strategy: auto
  sw_batch_size: 1
  overlap: 0.25
  mode: gaussian
  padding_mode: constant

# Sanity-specific knobs (read by the trainer in B4).
sanity:
  overfit_one_batch: true
  max_iterations: 200
  val_every: 50
