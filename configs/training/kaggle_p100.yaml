# Kaggle P100 16 GB profile (used by B7's notebooks).
name: kaggle_p100
patch_size: [96, 192, 160]
batch_size: 2
num_workers: 2
amp: true
pin_memory: true

optimizer:
  name: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-5

scheduler:
  name: poly
  exp: 0.9

augment_regime: standard

inference:
  sw_batch_size: 4
  overlap: 0.5
  mode: gaussian
  padding_mode: constant
