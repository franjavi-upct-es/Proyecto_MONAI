# Kaggle P100 16 GB profile (used by B7's notebooks).
name: kaggle_p100
patch_size: [96, 96, 96]
batch_size: 1
num_workers: 2
amp: true
pin_memory: true
resume_from: null

optimizer:
  name: adamw
  lr: 4.0e-4
  weight_decay: 1.0e-5

scheduler:
  name: cosine_warmup
  warmup_steps: 500

augment_regime: standard

inference:
  strategy: auto
  roi_size: [224, 224]
  sw_batch_size: 1
  overlap: 0.25
  mode: gaussian
  padding_mode: constant
