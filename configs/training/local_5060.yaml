# Perfil para RTX 5060 8 GB local.
name: local_5060
patch_size: [96, 96, 16]
batch_size: 1
num_workers: 4
persistent_workers: true
prefetch_factor: 2
amp: true
pin_memory: true
resume_from: null

unfreeze_epoch: -1
unfreeze_lr_factor: 0.1
val_every_epochs: 1

# Configuración de datos para cargar en RAM (CacheDataset). Override del bloque
# `data.cache` definido en `configs/data/task06.yaml`.
data:
  cache:
    mode: ram
    rate: 1.0
    num_workers: 4

optimizer:
  name: adamw
  lr: 4.0e-4
  weight_decay: 1.0e-5

scheduler:
  name: cosine_warmup
  warmup_steps: 100

augment_regime: standard       # one of: none, standard, aggressive

inference:
  strategy: auto
  roi_size: [224, 224]
  sw_batch_size: 1      # cada ventana ya empaca todos los slices Z; >1 multiplica VRAM
  overlap: 0.0          # validación rápida; el TTA full-res es para evaluación final
  mode: gaussian
  padding_mode: constant
