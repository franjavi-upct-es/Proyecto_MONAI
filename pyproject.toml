[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lungseg"
version = "0.1.0"
description = "Lung tumor segmentation & classification on MSD Task06_Lung (MONAI 1.5+)."
requires-python = ">=3.11"
dependencies = [
    "monai>=1.5.2",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "nibabel>=5.0.0",
    "scipy>=1.11.0",
    "scikit-image>=0.22.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "typer>=0.12",
    "rich>=13.0",
    "tqdm>=4.65",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.8",
    "ipykernel>=6.29",
]
kaggle = [
    "wandb>=0.17",
]
radiomics = [
    "pyradiomics",
    "pylidc>=0.2.3",
    "xgboost>=2.0",
]
demo = [
    "gradio>=4.0",
]

[project.scripts]
lungseg = "lungseg.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
pyradiomics = { git = "https://github.com/AIM-Harvard/pyradiomics.git" }

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "N803", "N806", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
