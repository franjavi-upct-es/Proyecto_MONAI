[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proyecto-monai"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "fire>=0.7.1",
    "gradio>=6.11.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.7.0",
    "monai>=1.3.0",
    "nibabel>=5.0.0",
    "numpy>=1.24.0",
    "opencv-python>=4.13.0.92",
    "pandas>=2.0.0",
    "pyradiomics",
    "ruff>=0.15.11",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.11.0",
    "simpleitk>=2.5.3",
    "torch>=2.0.0",
    "torchvision>=0.26.0",
]

[tool.uv]
# PyTorch index for CUDA builds (uncomment and adjust for your CUDA version)



[tool.ruff]
target-version = "py311"
line-length = 100
src = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",
  "N803",
  "N806",
  "B905",
]

[tool.setuptools.packages.find]
where = ["scripts"]

[tool.uv.sources]
pyradiomics = { git = "https://github.com/AIM-Harvard/pyradiomics.git" }
